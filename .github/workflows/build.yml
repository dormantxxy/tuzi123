name: Local Tools Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Install Android SDK
        run: |
          set -uo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMGR="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1)"
          if [ -z "$SDKMGR" ]; then SDKMGR="$(find "$ANDROID_HOME" -name sdkmanager 2>/dev/null | head -n1)"; fi
          echo "sdkmanager=$SDKMGR"
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          install_pkg() {
            local pkg="$1"; local i
            for i in 1 2 3; do
              if "$SDKMGR" "$pkg" >/dev/null 2>&1; then echo "installed: $pkg"; return 0; fi
              echo "retry($i) $pkg"; sleep 8
            done
            echo "::warning::could not install $pkg"; return 0
          }
          install_pkg "platform-tools"
          install_pkg "build-tools;36.0.0"
          install_pkg "build-tools;37.0.0"
          install_pkg "platforms;android-36"
          install_pkg "platforms;android-37"
          install_pkg "ndk;28.2.13676358"
          if [ ! -d "$ANDROID_HOME/ndk/28.2.13676358" ]; then echo "::error::NDK 28.2.13676358 missing"; exit 1; fi
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Placeholder google-services.json
        run: |
          if [ ! -f app/google-services.json ]; then
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "123456789000",
              "project_id": "rikkahub-local-tools",
              "storage_bucket": "rikkahub-local-tools.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789000:android:0000000000000000000000",
                  "android_client_info": { "package_name": "me.rerere.rikkahub" }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "AIzaSyAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789000:android:1111111111111111111111",
                  "android_client_info": { "package_name": "me.rerere.rikkahub.debug" }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "AIzaSyAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          JSON
          fi

      - name: Configure fixed signing keystore
        run: |
          set -e
          KEYSTORE="$PWD/app/keystore/release.keystore"
          if [ ! -f "$KEYSTORE" ]; then echo "::error::keystore not found"; exit 1; fi
          keytool -list -keystore "$KEYSTORE" -storepass android -alias androiddebugkey
          cat >> local.properties <<EOF
          storeFile=$KEYSTORE
          storePassword=android
          keyAlias=androiddebugkey
          keyPassword=android
          EOF

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build GitHub release APK (R8)
        env:
          RIKKAHUB_VERSION_BUMP: ${{ github.run_number }}
        run: ./gradlew assembleGithubRelease --no-daemon --max-workers=2 --stacktrace -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Publish Release (new tag every build)
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.1.1-build${{ github.run_number }}
          name: RikkaHub 3.1.1 build${{ github.run_number }}
          body_path: RELEASE_NOTES.txt
          prerelease: false
          make_latest: true
          files: |
            app/build/outputs/apk/github/release/*.apk
